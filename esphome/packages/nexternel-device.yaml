# Every Nexternel board includes this file.
# MQTT is the connection the dashboard uses.
# The native API stays available so ESPHome can install updates and show logs.
# An idle API must not restart the board.
api:
  reboot_timeout: 0s

# Boards are plugged in: Wi-Fi power saving (ESPHome's standard on ESP32) only makes the radio doze,
# which drops the connection now and then. A board's own file can still choose otherwise.
wifi:
  power_save_mode: none

# Two readings about the board itself, so Nexternel can tell a weak Wi-Fi signal from a restart.
sensor:
  - platform: wifi_signal
    # Nexternel reads it as <prefix>/sensor/wifi_signal/state: keep this name.
    name: "WiFi signal"
    id: nexternel_wifi_signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    # Nexternel reads it as <prefix>/sensor/uptime/state: keep this name.
    name: "Uptime"
    id: nexternel_uptime
    type: seconds
    update_interval: 60s
    entity_category: diagnostic

# Which software the board runs: ESPHome's fingerprint of its settings (the same one ESPHome gives each
# build). Nexternel compares it with the newest build to tell whether the board needs an update —
# without depending on network announcements, which do not reach the server on every home network.
text_sensor:
  - platform: template
    # Nexternel reads it as <prefix>/text_sensor/software_fingerprint/state: keep this name.
    name: "Software fingerprint"
    id: nexternel_software_fingerprint
    entity_category: diagnostic
    update_interval: 15min
    lambda: |-
      char buf[9];
      snprintf(buf, sizeof(buf), "%08x", (unsigned) App.get_config_hash());
      return std::string(buf);
