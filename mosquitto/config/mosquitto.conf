# Nexternel - Mosquitto MQTT Broker Configuration (package version: see VERSION at repo root)

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
# Nexternel reads the message service's notices (why a device was disconnected) from $SYS/broker/log.
log_dest topic

# WebSocket listener (optional, for browser MQTT clients)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
