# Nexternel stack — package version: see VERSION at repo root
services:
  postgres:
    image: postgres:16.15-alpine
    container_name: nexternel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Only this server — Nexternel's own services reach the database over Docker's network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7.12-alpine
    container_name: nexternel-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      TZ: ${TZ}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      # Only this server (sensor history). Open it to the network only if you need InfluxDB's own UI.
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: nexternel-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  esphome:
    image: ghcr.io/esphome/esphome:2026.9.1
    container_name: nexternel-esphome
    restart: unless-stopped
    network_mode: host
    # The ESPHome page is not open on the network: it answers only Caddy, through a socket, and Caddy
    # lets in people who opened it from Nexternel (Devices → Open in ESPHome) — same address, port 6052.
    command: ["dashboard", "--socket", "/run/esphome/dashboard.sock", "/config"]
    # Its own health check, through the socket (port 6052 is Caddy's now).
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --unix-socket /run/esphome/dashboard.sock http://localhost/version || exit 1"]
      interval: 30s
      timeout: 30s
    volumes:
      - ./esphome:/config
      - esphome_socket:/run/esphome
    environment:
      TZ: ${TZ}
      # Use ping instead of mDNS for online/offline (mDNS often fails in Docker)
      ESPHOME_DASHBOARD_USE_PING: "true"
    # Optional: plug ESP32 into the Ubuntu server USB and uncomment for direct flash:
    # privileged: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

  # --- Nexternel (api + ui) — V2 Next.js `web` retired in Phase 10 ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexternel-api
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      TZ: ${TZ}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      SERVER_IP: ${SERVER_IP}
      GO2RTC_URL: ${GO2RTC_URL:-http://go2rtc:1984}
      GO2RTC_PUBLIC_URL: ${GO2RTC_PUBLIC_URL:-}
      MOSQUITTO_CONFIG_DIR: /mosquitto-config
      BACKUP_JOBS_DIR: /backup-jobs
      PLUGINS_DIR: /plugins
      PLUGIN_CATALOG_URL: ${PLUGIN_CATALOG_URL:-}
      # Paid add-ons: only for testing with a practice licence server (empty = the Nexternel shop)
      ADDON_LICENCE_URL: ${ADDON_LICENCE_URL:-}
      ADDON_PUBLIC_KEY: ${ADDON_PUBLIC_KEY:-}
      UPDATE_FEED_URL: ${UPDATE_FEED_URL:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      LOCAL_NAME: ${LOCAL_NAME:-nexternel}
      ALLOW_DOCKER_RESTART: "true"
    volumes:
      # ESPHome YAML (rw so System → Adopt can write device configs)
      - ./esphome:/esphome
      # Mosquitto credentials (backup / restore)
      - ./mosquitto/config:/mosquitto-config
      # Backup job working files
      - backup_jobs:/backup-jobs
      # Automatic backups — on the server in ~/nexternel/backups (copy off regularly).
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
      # Host CPU thermal zones for System Information widget (read-only)
      - /sys/class/thermal:/sys/class/thermal:ro
      # Installed plugins (shared with the plugin container)
      - ./plugins:/plugins
      # Secure connection: Nexternel writes Caddy's settings and reads the home certificate
      - ./caddy:/caddy
      - caddy_data:/caddy-data:ro
      # Nexternel Anywhere: settings shared with the home link (door-link) and its state
      - ./anywhere:/anywhere
    networks:
      - default
      - plugins
    ports:
      # Only this server (update and install checks). Screens reach the API through the page
      # server, so the login rules and the visitor's address apply to every request.
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
      go2rtc:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: nexternel-ui
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    # Reached through the caddy service (the secure front door), not directly.
    expose:
      - "80"
    depends_on:
      - api
      - go2rtc

  # Answers "nexternel.local" on the home network, so devices at home can open
  # http://nexternel.local (becomes nexternel-2.local if another machine already uses the name).
  local-name:
    build:
      context: .
      dockerfile: apps/local-name/Dockerfile
    container_name: nexternel-local-name
    restart: unless-stopped
    network_mode: host
    environment:
      NEXTERNEL_LOCAL_NAME: ${LOCAL_NAME:-nexternel}

  # Front door for browsers: plain http on 80 and 8080 (the normal address), and https once a
  # name with a trusted certificate is set up. Configured by Nexternel.
  caddy:
    image: caddy:2.11.4-alpine
    container_name: nexternel-caddy
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - esphome_socket:/run/esphome
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${UI_PORT:-8080}:8080"
      - "6052:6052"
    # ESPHome first: it must have let go of port 6052 before Caddy takes it.
    depends_on:
      - ui
      - esphome

  # Nexternel Anywhere: reaching this home from outside with no router changes. Calls out to
  # Reynsys' door and brings visitors in to Caddy's outside entrance. Does nothing until it is
  # switched on in Settings → System → Nexternel Anywhere. Opens no port on the server.
  door-link:
    build:
      context: .
      dockerfile: apps/door-link/Dockerfile
    container_name: nexternel-door-link
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LINK_SETTINGS_FILE: /anywhere/anywhere.json
      LINK_STATUS_FILE: /anywhere/status.json
    volumes:
      - ./anywhere:/anywhere
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - caddy

  # RTSP → browser-friendly live streams (HLS / MSE / WebRTC)
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    container_name: nexternel-go2rtc
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./go2rtc:/config
    ports:
      # Only this server. go2rtc has no login of its own; screens watch cameras through the page
      # server (/go2rtc/), which lets only the video through and only after a login check.
      - "127.0.0.1:${GO2RTC_PORT:-1984}:1984"

  # Plugins run here, each as its own user. On its own network, the only Nexternel service
  # it can reach is the API's plugin doorway (plus the home network and internet).
  plugins:
    build:
      context: .
      dockerfile: apps/plugin-host/Dockerfile
    container_name: nexternel-plugins
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ}
      NEXTERNEL_API: http://api:4000
      PLUGINS_DIR: /plugins
    volumes:
      - ./plugins:/plugins
    networks:
      - plugins
    depends_on:
      - api


  # GPS tracking (optional): only runs where COMPOSE_PROFILES=gps is set in .env.
  traccar-db:
    image: postgres:16.15-alpine
    container_name: nexternel-traccar-db
    restart: unless-stopped
    profiles: ["gps"]
    environment:
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: traccar
      TZ: ${TZ}
    volumes:
      - traccar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traccar never deletes anything, so GPS history older than GPS_HISTORY_DAYS is removed once a day.
  # Each tracker's latest position is kept: it is where the tracker is now.
  traccar-cleanup:
    image: postgres:16.15-alpine
    container_name: nexternel-traccar-cleanup
    restart: unless-stopped
    profiles: ["gps"]
    depends_on:
      traccar-db:
        condition: service_healthy
    environment:
      PGHOST: traccar-db
      PGUSER: traccar
      PGDATABASE: traccar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GPS_HISTORY_DAYS: ${GPS_HISTORY_DAYS:-31}
    command:
      - sh
      - -c
      - |
        while true; do
          sleep 300
          psql -q -c "DELETE FROM tc_positions WHERE fixtime < now() - interval '$$GPS_HISTORY_DAYS days' AND id NOT IN (SELECT positionid FROM tc_devices WHERE positionid IS NOT NULL)" \
                  -c "DELETE FROM tc_events WHERE eventtime < now() - interval '$$GPS_HISTORY_DAYS days'" \
            || echo "GPS history clean-up did not run; trying again tomorrow"
          sleep 86100
        done

  # Traccar receives what GPS trackers send and keeps their history. People use it through Nexternel,
  # so its website is not opened to the network; the plugins space reaches it by name.
  traccar:
    image: traccar/traccar:6.17.0-alpine
    container_name: nexternel-traccar
    restart: unless-stopped
    profiles: ["gps"]
    depends_on:
      traccar-db:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://traccar-db:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Work out journey details in full over the whole month of history (top speed needs it).
      REPORT_FAST_THRESHOLD: "3000000"
      TZ: ${TZ}
    volumes:
      - traccar_logs:/opt/traccar/logs
    ports:
      # SinoTrack and other H02 trackers.
      - "5013:5013/tcp"
    networks:
      - default
      - plugins

networks:
  default:
  plugins:

volumes:
  traccar_db_data:
  traccar_logs:
  postgres_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:
  backup_jobs:
  caddy_data:
  caddy_config:
  esphome_socket:
